id: beta_weighted_unifrac
name: Beta Diversity Weighted UniFrac
version: "qiime2-2024.2"
description: >
  对均一化后的 ASV 表进行 beta 多样性分析，
  计算 weighted UniFrac 距离矩阵。需要有根进化树。

inputs:
  - id: rooted_tree
    description: "有根进化树（QZA 格式）"
    type:
      format: "QZA"
      semantic: "PhylogeneticTree.Rooted"
    required: true
  - id: even_table
    description: "均一化后的 ASV 表（QZA 格式）"
    type:
      format: "QZA"
      semantic: "EvenFeatureTable.QZA"
    required: true

outputs:
  - id: distance_matrix
    description: "Weighted UniFrac 距离矩阵"
    type:
      format: "QZA"
      semantic: "DistanceMatrix.WeightedUnifrac"
    filename_template: "weighted-unifrac_distance_matrix.qza"

parameters: []

script_template: |
  qiime diversity beta-phylogenetic \
    --i-phylogeny {{ inputs.rooted_tree }} \
    --i-table {{ inputs.even_table }} \
    --p-metric weighted-unifrac \
    --o-distance-matrix {{ outputs.distance_matrix }}
